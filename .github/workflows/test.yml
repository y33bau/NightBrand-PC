name: Test gry
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalacja przegladarki testowej
        run: npm i -g playwright@1.48.2 && playwright install --with-deps chromium
      - name: Zbuduj gre ze zrodla
        run: python3 narzedzia/zbuduj.py zrodlo/main gra
      - name: Kontrola spojnosci
        run: python3 narzedzia/sprawdz.py gra
      - name: Test dymny (rozdzial I)
        run: NODE_PATH=$(npm root -g) node narzedzia/dymny.js gra 1
